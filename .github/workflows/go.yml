name: Go

on:
  push:
    branches: [ "main", "devnet", "testnet"]
  pull_request:
    branches: [ "main", "devnet", "testnet" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    env:
      WalletSdkTestM1: ${{ secrets.WALLETSDKTESTM1 }}
    steps:
    - uses: actions/checkout@v3

    - name: Set up Go
      uses: actions/setup-go@v3
      with:
        go-version: '1.26'

    - name: Build
      run: go build -v ./...

    # Typechecks the live-tagged tests, which no other step compiles: they need
    # an endpoint to run, so they are excluded from Test and would otherwise rot
    # unnoticed. Vet does not execute them, so this stays offline and free.
    - name: Vet (including live-tagged tests)
      run: go vet -tags live ./...

    # client/ and account/ tests hit Sui's retired public JSON-RPC/faucet
    # endpoints and fail unconditionally; keep them out of CI.
    - name: Test
      run: go test -v $(go list ./... | grep -v -e '/go-sui-sdk/client$' -e '/go-sui-sdk/account$')